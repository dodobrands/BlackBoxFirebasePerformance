name: Unit Tests

on:
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: 'macos-latest'

    timeout-minutes: 30

    env:
      SCHEME: "BlackBoxFirebasePerformance"

    strategy:
      # One platform failing should not hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          - destination: "platform=iOS Simulator"
            platform: ios
            sim_profile: ios
          - destination: "platform=OS X"
            platform: macos
          - destination: "platform=tvOS Simulator"
            platform: tvos
            sim_profile: tvos
          - destination: "platform=watchOS Simulator"
            platform: watchos
            sim_profile: watchos

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Prepare Environment for App Build
        uses: ./.github/actions/prepare_env_app_build

      - name: Resolve Dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Read simulator configuration
        id: read-simulator-config
        if: matrix.platform != 'macos'
        uses: ./.github/actions/read_simulator_config
        with:
          profile: ${{ matrix.sim_profile }}

      - name: Create Simulator
        id: create_simulator
        if: matrix.platform != 'macos'
        uses: ./.github/actions/create_sim
        with:
          name: ${{ steps.read-simulator-config.outputs.sim-name }}
          device: ${{ steps.read-simulator-config.outputs.sim-device }}
          system: ${{ steps.read-simulator-config.outputs.sim-system }}
      
      - name: Select Destination
        id: select-destination
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            echo "dest=${{ matrix.destination }}" >> $GITHUB_OUTPUT
          else
            echo "dest=${{ matrix.destination }},id=${{ steps.create_simulator.outputs.uuid }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build
        run: >
          xcodebuild build-for-testing
          -scheme ${{ env.SCHEME }}
          -destination '${{ steps.select-destination.outputs.dest }}'
          -quiet
          SWIFT_SUPPRESS_WARNINGS=NO

      - name: Test
        run: >
          xcodebuild test-without-building
          -scheme ${{ env.SCHEME }}
          -destination '${{ steps.select-destination.outputs.dest }}'
          -quiet
          SWIFT_SUPPRESS_WARNINGS=NO

  # This allows us to have a branch protection rule for tests and deploys with matrix
  status-for-matrix:
    runs-on: 'ubuntu-latest'
    needs: tests
    if: always()
    steps:
      - name: Calculate matrix result
        run: |
          result="${{ needs.tests.result }}"
          if [[ $result == "success" ]]; then
            exit 0
          else
            exit 1
          fi
